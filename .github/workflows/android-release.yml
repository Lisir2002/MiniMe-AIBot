name: Android Release

# 打 Tag（如 v1.0.0-rc2）时触发：构建 arm64 真机 Release APK（R8 混淆 + 资源压缩 + 正式签名），
# 创建 GitHub Release 并把 APK + R8 映射作为资产发布。
# 只保留真机 arm64-v8a 适配：不再构建/发布 x86_64 模拟器包与 universal 通用包（见 README）。
on:
  push:
    tags:
      - 'v*'
  # 允许在 Actions 页面手动触发，便于验证构建链路。
  workflow_dispatch:

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 创建 Release 与上传资产需要写权限
      packages: write   # 推送合并基座镜像到 ghcr.io 需要写权限

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 版本号由 GITHUB_REF_NAME（tag）派生：v1.0.0-rc2 → versionName 1.0.0-rc2。
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # 复用 Gradle 构建缓存，加速后续构建。
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # 打印当前 Tag，仅打 tag 触发时执行；workflow_dispatch（手动，无 tag）跳过。
      - name: Display release tag info
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -e
          tag_ver="${GITHUB_REF_NAME#v}"
          echo "tag version (without v) = $tag_ver"

      - name: Restore release keystore
        env:
          # keystore 文件以 base64 存入 Secret，避免二进制文件被破坏。
          KEYSTORE_BASE64: ${{ secrets.MINIMECODE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/minimecode.jks
          echo "keystore restored ($(stat -c%s app/minimecode.jks) bytes)"

      - name: Generate keystore.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.MINIMECODE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MINIMECODE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MINIMECODE_KEY_PASSWORD }}
        run: |
          cat > app/keystore.properties <<EOF
          storeFile=minimecode.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "app/keystore.properties generated"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 发版前最后一道闸：迁移编号连续、SCHEMA_VERSION 一致、已发布迁移未被篡改/复用。
      - name: Check migration versions
        run: python3 scripts/check_migrations.py

      # 内置使用手册产物与文档源一致性：防止 App 里的手册与官网文档站内容漂移。
      - name: Check built-in docs are in sync
        run: python3 scripts/sync-app-docs.py --check

      # 发版质量门禁：跑单元测试，失败即中止，避免发出回归包。
      # 只跑 armsolo debug 变体：单测逻辑与 flavor 无关。
      - name: Run unit tests
        run: ./gradlew :app:testArmsoloDebugUnitTest

      # 只构建 arm64 真机包（armsolo flavor：arm64-v8a + 仅 arm 容器镜像）。
      # release 已开启 R8（isMinifyEnabled）+ 资源压缩（isShrinkResources），并使用上面还原的正式签名。
      - name: Build arm64 Release APK
        run: ./gradlew :app:assembleArmsoloRelease --stacktrace

      # 构建云端 agent-server fat jar（版本号由 GITHUB_REF_NAME 注入）。
      # 作为 Release 资产发布，供 App「一键部署/升级云端 Agent」从 GitHub Release 下载到用户服务器。
      - name: Build agent-server jar
        run: ./gradlew :agent-server:jar --stacktrace

      # 构建合并基座镜像（Java + 完整工具链），推到 ghcr.io（docker pull 主通道），
      # 同时导出 tar 作为 Release 资产（国内 pull 失败时 docker load 兜底）。
      # 镜像 tag 固定为 :base（低频更新），jar 仍外挂走 Release，故每次发版重推内容基本不变、层缓存命中很快。
      - name: Build & push unified agent-server image (ghcr.io)
        run: |
          set -e
          IMAGE="ghcr.io/lisir2002/minimecode-agent-server:base"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -t "$IMAGE" -f docker/agent-server/Dockerfile .
          docker push "$IMAGE"
          # 导出镜像 tar 供 Release 兜底（gzip 压缩减小体积）
          mkdir -p dist
          docker save "$IMAGE" | gzip -c > "dist/agent-server-base.tar.gz"

      # 产物重命名为「包名-架构-版本」格式，并保留 R8 混淆映射（mapping.txt）用于崩溃堆栈反混淆。
      - name: Rename APK & collect mapping
        run: |
          set -e
          mkdir -p dist
          ver="${GITHUB_REF_NAME:-manual}"
          src="app/build/outputs/apk/armsolo/release/app-armsolo-release.apk"
          if [[ ! -f "$src" ]]; then
            echo "::error::missing $src"
            exit 1
          fi
          cp "$src" "dist/minimecode-arm64-${ver}.apk"
          # AGP 8.x mapping 输出目录是 variant 驼峰名：outputs/mapping/armsoloRelease/。
          if [[ -f "app/build/outputs/mapping/armsoloRelease/mapping.txt" ]]; then
            gzip -c "app/build/outputs/mapping/armsoloRelease/mapping.txt" > "dist/minimecode-arm64-${ver}-mapping.txt.gz"
          else
            echo "::warning::missing mapping.txt（R8 混淆映射）"
          fi
          # 云端 agent-server jar：重命名为带版本名，供升级通道按 tag 精确定位下载。
          if [[ -f "agent-server/build/libs/agent-server.jar" ]]; then
            cp "agent-server/build/libs/agent-server.jar" "dist/agent-server-${ver}.jar"
          else
            echo "::error::missing agent-server.jar"
            exit 1
          fi
          ls -lh dist/

      - name: Determine release name
        id: release
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=manual-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine prerelease flag
        id: prerelease
        run: |
          tag="${{ steps.release.outputs.tag }}"
          if [[ "$tag" =~ -(rc|dev|beta|alpha)([.0-9]*)?$ ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "检测到预发布后缀，标记为 pre-release"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "正式版，不标记 pre-release"
          fi

      # 本仓库在 main 上直接 commit，不走 PR 流程，GitHub 的 generate_release_notes 列不出直接提交。
      # 用脚本解析 conventional commits，按类型分类并保留每条完整正文（根因/改动清单），
      # 生成结构化、可追溯的 Release 说明，而不是一串只有标题的平铺短句。
      - name: Generate changelog from git log
        id: changelog
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cur_tag="${GITHUB_REF_NAME}"
          echo "generating release notes for ${cur_tag}"
          # prev_tag 完全交给脚本推断：正式版对比上一正式版（汇总整个 rc 周期），
          # 预发布版对比最近一个 tag。CI 不传入，避免覆盖脚本的分支逻辑。
          delimiter="EOF_$(date +%s)"
          {
            echo "body<<${delimiter}"
            python3 scripts/gen_release_notes.py "${cur_tag}"
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release & Upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Release ${{ steps.release.outputs.tag }}
          body: ${{ steps.changelog.outputs.body }}
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
          files: |
            dist/minimecode-arm64-*.apk
            dist/minimecode-arm64-*mapping.txt.gz
            dist/agent-server-*.jar
            dist/agent-server-base.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
