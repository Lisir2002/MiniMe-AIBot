name: Beta Build

# push 到 main 时自动构建一个测试包：armsolo flavor（仅 arm64-v8a 真机）、正式签名、
# 与 release 同配置（R8/资源压缩），仅 applicationId 后缀 .beta（com.minime.code.beta，可与正式版同机共存）。
# 只保留真机 arm64-v8a 适配，不构建 universal/x86。产物上传到 Actions Artifacts（默认保留 90 天），不进 GitHub Release。
# 打 v* tag 的正式发版走 android-release.yml；合入前门禁走 ci.yml。
on:
  push:
    branches: [ main ]
    # 纯文档/资源改动不影响 APK，跳过省时间（与 ci.yml 保持一致）。
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'docs-site/**'
      - 'LICENSE'
      - '.gitignore'
  # 允许在 Actions 页面手动触发，便于验证链路。
  workflow_dispatch:

# 同分支新提交到来时取消正在跑的旧 beta 构建，省额度。
concurrency:
  group: beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Beta APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # beta 用正式签名：从 Secret 还原 keystore 到 app/minimecode.jks，并生成 keystore.properties，
      # 与 android-release.yml 完全一致；缺任一步 beta 包会变成 unsigned。
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MINIMECODE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/minimecode.jks
          echo "keystore restored ($(stat -c%s app/minimecode.jks) bytes)"

      - name: Generate keystore.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.MINIMECODE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MINIMECODE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MINIMECODE_KEY_PASSWORD }}
        run: |
          cat > app/keystore.properties <<EOF
          storeFile=minimecode.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "app/keystore.properties generated"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 只构建 arm64 真机包（armsolo flavor）。--stacktrace：失败时输出完整调用栈。
      - name: Build arm64 beta APK
        run: ./gradlew :app:assembleArmsoloBeta --stacktrace

      # 产物重命名为 minimecode-arm64-beta-<sha7>.apk，短 sha 便于区分每次构建。
      # 同时带上 R8 混淆映射（mapping.txt），供 beta 崩溃报告反混淆。
      - name: Rename APK & collect mapping
        run: |
          set -e
          mkdir -p dist
          sha7="${GITHUB_SHA::7}"
          cp "app/build/outputs/apk/armsolo/beta/app-armsolo-beta.apk" \
             "dist/minimecode-arm64-beta-${sha7}.apk"
          if [[ -f "app/build/outputs/mapping/armsoloBeta/mapping.txt" ]]; then
            cp "app/build/outputs/mapping/armsoloBeta/mapping.txt" \
               "dist/minimecode-arm64-beta-${sha7}-mapping.txt"
          fi
          ls -lh dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: minimecode-beta-${{ github.sha }}
          path: |
            dist/minimecode-arm64-beta-*.apk
            dist/minimecode-arm64-beta-*-mapping.txt
          if-no-files-found: error
